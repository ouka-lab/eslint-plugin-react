name: 'Runtime bump'

# Opens a PR per target when Node.js / pnpm / ESLint move on, which Dependabot does not cover:
# the CI matrices, engines.node, peerDependencies.eslint and devEngines.packageManager
on:
  schedule:
    # Saturdays 10:00 JST, with Dependabot
    - cron: '0 1 * * 6'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bump:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # the action pushes with RUNTIME_BUMP_TOKEN, not the checkout token
          persist-credentials: false
          show-progress: false
      # for `post-update`; this installs the pnpm pinned before the bump
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 'lts/*'

      - uses: ouka-lab/js-runtime-bump-action@190d178163bab01b3ee74f247d41fa3e14fbc40b # v0.1.0
        with:
          # a pnpm bump changes packageManagerDependencies in pnpm-lock.yaml.
          # `--pm-on-fail=download` lets the old pnpm hand over to the newly pinned one instead of failing on `onFail: error`
          post-update: pnpm install --lockfile-only --pm-on-fail=download
          # fine-grained PAT with Contents, Pull requests and Workflows: read & write.
          # GITHUB_TOKEN can not push changes to .github/workflows/, and the PRs it opens do not trigger CI.
          github-token: ${{ secrets.RUNTIME_BUMP_TOKEN }}
          targets: |
            node
            pnpm
            npm:eslint
          matrix: |
            .github/workflows/eslint.yml#node-version=node
            .github/workflows/eslint.yml#eslint=npm:eslint
            .github/workflows/type-check.yml#eslint_version=npm:eslint
          # same as minimumReleaseAge in pnpm-workspace.yaml and the Dependabot cooldown
          minimum-release-age: '14'
