name: "Types: check published types"

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  test:
    name: ESLint ${{ matrix.eslint_version }}, TS ${{ matrix.ts.version }}, "${{ matrix.ts.lib }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        eslint_version:
          - 9
          - 10
        # the oldest and the newest TS / lib, and the DOM lib (whose globals can conflict with the types)
        # ESLint 9+ ships types via @eslint/core which requires TS >= 5.0
        ts:
          - { version: '5.0', lib: es2015 }
          - { version: '6.0', lib: 'es2015,dom' }
          - { version: '6.0', lib: esnext }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          show-progress: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 'lts/*'
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Pack the lib into a tarball (`prepack` builds the types) so that when we install
      # the lib later in the test-published-types directory, it only installs the `dependencies` of the lib.
      - name: pack the lib
        run: pnpm pack --pack-destination "$RUNNER_TEMP"

      - name: find the packed lib
        run: echo "ESLINT_PLUGIN_REACT_PATH=$(ls "$RUNNER_TEMP"/ysknsid25-eslint-plugin-react-*.tgz | tail -n 1)" >> "$GITHUB_ENV"

      # test-published-types is a separate package, not part of this repository's pnpm workspace
      - name: install @ysknsid25/eslint-plugin-react, eslint ${{ matrix.eslint_version }} and typescript ${{ matrix.ts.version }}
        run: pnpm add --ignore-workspace "$ESLINT_PLUGIN_REACT_PATH" "eslint@^${{ matrix.eslint_version }}" "typescript@${{ matrix.ts.version }}"
        working-directory: test-published-types

      - name: show installed versions
        run: pnpm list --ignore-workspace --depth=0
        working-directory: test-published-types

      - name: check types with lib "${{ matrix.ts.lib }}"
        run: pnpm exec tsc --lib ${{ matrix.ts.lib }}
        working-directory: test-published-types
